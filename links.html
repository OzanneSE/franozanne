<style>
:root{
  --bg:#121009; --ink:#F3EEE2; --ink-2:#B9AF9B;
  --line:#332E22; --card:#1E1B13;
  --green:#5A9663; --terracotta:#D97A44; --terracotta-dim:#B5572A; --gold:#C8A030;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;
  min-height:100vh;display:flex;justify-content:center;padding:56px 20px;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:420px;width:100%;text-align:center}
.avatar{
  width:112px;height:112px;margin:0 auto 18px;overflow:hidden;
  border:3px solid var(--terracotta);box-shadow:6px 6px 0 rgba(217,122,68,.35);
  transform:rotate(-2deg);
}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;letter-spacing:.02em;margin-bottom:4px}
.role{font-family:'DM Mono',monospace;font-size:.8rem;color:var(--gold);margin-bottom:8px;letter-spacing:.05em;text-transform:uppercase}
.tagline{font-size:.95rem;color:var(--ink-2);margin-bottom:34px}
.links{display:grid;gap:14px}
.link{
  display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);
  padding:16px 20px;text-decoration:none;color:var(--ink);text-align:left;
  transition:transform .15s, border-color .15s;
}
.link:hover{transform:translate(-2px,-2px);border-color:var(--terracotta)}
.link .ico{
  width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;border:1px solid var(--line);
}
.link .txt b{display:block;font-size:.98rem}
.link .txt span{font-size:.8rem;color:var(--ink-2)}
.link.primary{background:var(--terracotta-dim);border-color:var(--terracotta-dim)}
.link.primary .ico{border-color:rgba(255,255,255,.3)}
.link.primary .txt b,.link.primary .txt span{color:#1a1108}
footer{margin-top:40px;font-size:.76rem;color:var(--ink-2);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.04em}
</style>
</head>
<body>
<div class="page">
  <div class="avatar"><img src="assets/avatar-fran8.jpg" alt="Fran Ozanne"></div>
  <h1>FRAN OZANNE</h1>
  <p class="role">Chef · Consultor Gastronômico</p>
  <p class="tagline">Da raiz ao prato — técnica, tempero e leveza.</p>

  <div class="links">
    <a class="link primary" href="mailto:fran.ozanne@gmail.com">
      <div class="ico">✉️</div>
      <div class="txt"><b>Falar comigo</b><span>Consultoria e projetos — resposta direta</span></div>
    </a>
    <a class="link" href="https://instagram.com/fran.ozanne" target="_blank" rel="noopener">
      <div class="ico">📷</div>
      <div class="txt"><b>Instagram</b><span>@fran.ozanne</span></div>
    </a>
    <a class="link" href="index.html">
      <div class="ico">🌐</div>
      <div class="txt"><b>Site &amp; Consultoria</b><span>Serviços, metodologia e cases</span></div>
    </a>
    <a class="link" href="#" target="_blank" rel="noopener">
      <div class="ico">💼</div>
      <div class="txt"><b>LinkedIn</b><span>Perfil profissional</span></div>
    </a>
  </div>

  <footer>Aracaju, Sergipe, Brasil</footer>
</div>
</body>
